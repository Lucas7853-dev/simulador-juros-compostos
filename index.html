<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteBank - Simulador de Juros Compostos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .bank-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
        }
        .brand {
            color: #4A00E0;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #4A00E0, #8E2DE2);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #f0fdf4;
            border-left: 4px solid #16a34a;
            border-radius: 4px;
            display: none;
        }
        .result-title {
            color: #16a34a;
            font-weight: bold;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="bank-card">
    <div class="brand">🏦 ByteBank</div>
    <div class="subtitle">Simulador Oficial de Investimentos</div>

    <div class="input-group">
        <label for="capital">Capital Inicial (R$):</label>
        <input type="number" id="capital" placeholder="Ex: 1000" required>
    </div>

    <div class="input-group">
        <label for="taxa">Taxa de Juros (% ao mês):</label>
        <input type="number" id="taxa" step="0.1" placeholder="Ex: 1" required>
    </div>

    <div class="input-group">
        <label for="tempo">Tempo (Meses):</label>
        <input type="number" id="tempo" placeholder="Ex: 12" required>
    </div>

    <button onclick="calcularJuros()">Simular Investimento</button>

    <div id="resultado" class="result-box">
        <div class="result-title">📊 Extrato da Simulação:</div>
        <p><strong>Valor Total Final:</strong> <span id="resMontante">R$ 0,00</span></p>
        <p><strong>Juros Acumulados:</strong> <span id="resJuros">R$ 0,00</span></p>
    </div>
</div>

<script>
function calcularJuros() {
    const P = parseFloat(document.getElementById('capital').value);
    const i = parseFloat(document.getElementById('taxa').value) / 100;
    const t = parseInt(document.getElementById('tempo').value);

    if (isNaN(P) || isNaN(i) || isNaN(t)) {
        alert("Por favor, preencha todos os campos corretamente.");
        return;
    }

    const M = P * Math.pow((1 + i), t);
    const juros = M - P;

    const formatarMoeda = (valor) => valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    document.getElementById('resMontante').innerText = formatarMoeda(M);
    document.getElementById('resJuros').innerText = formatarMoeda(juros);
    
    document.getElementById('resultado').style.display = 'block';
}
</script>

</body>
</html>
